# -----------------$HOME/.abcde.conf----------------- #

########### action
#ACTIONS=cddb,playlist,read,encode,tag,move,clean
ACTIONS=cddb,read,getalbumart,encode,tag,move,clean



########### cddb
CDDBMETHOD=musicbrainz,cddb
# CDDBMETHOD=cddb
# CDDBMETHOD=musicbrainz
CDDBURL="https://gnudb.gnudb.org:443/~cddb/cddb.cgi"
# CDDBURL="http://gnudb.gnudb.org/~cddb/cddb.cgi"
CDDBPROTO=6
HELLOINFO="$(whoami)@$(hostname)"
CDDBCOPYLOCAL="y"
CDDBUSELOCAL="y"
CDDBLOCALDIR="$HOME/.cddb"
CDDBLOCALRECURSIVE="y"
CDDBLOCALPOLICY="new"
SHOWCDDBFIELDS="year,genre"



########### ripp
CDROMREADERSYNTAX=cdparanoia
CDPARANOIA=cdparanoia
CDPARANOIAOPTS="--never-skip=40"

CDDISCID=cd-discid



########### flac
FLACENCODERSYNTAX=flac
FLAC=flac
FLACOPTS='-s -e -V -8'

########### ogg
OGGENCODERSYNTAX=oggenc
OGGENC=oggenc
OGGENCOPTS='-q 8'

########### mp3
MP3ENCODERSYNTAX=lame
LAME=lame
LAMEOPTS='-V 0'

########### opus
OPUSENCODERSYNTAX=opusenc
OPUSENC=opusenc
OPUSENCOPTS="--vbr --bitrate 160"

########### aac
AACENCODERSYNTAX=faac
FAAC=faac
FAACENCOPTS='-q 150'



########### output
OUTPUTTYPE="flac mp3 opus m4a"
OUTPUTDIR="$HOME/work/music"
OUTPUTFORMAT='${OUTPUT}/${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM}.${ARTISTFILE}.${TRACKFILE}'
VAOUTPUTDIR="$HOME/work/music"
VAOUTPUTFORMAT='${OUTPUT}/Various/${ALBUMFILE}/${TRACKNUM}.${TRACKFILE}'
ONETRACKOUTPUTFORMAT='${OUTPUT}/${ARTISTFILE}/${ALBUMFILE}/${ARTISTFILE}.${ALBUMFILE}'
VAONETRACKOUTPUTFORMAT='${OUTPUT}/Various/${ALBUMFILE}/${ALBUMFILE}'
PLAYLISTFORMAT='${OUTPUT}/${ARTISTFILE}/${ALBUMFILE}/${ALBUMFILE}.m3u'
VAPLAYLISTFORMAT='${OUTPUT}/Various/${ALBUMFILE}/${ALBUMFILE}.m3u'



########### eyed3
EYED3OPTS="--non-std-genres"



########### extra
MAXPROCS=2                              # Run a few encoders simultaneously
PADTRACKS=y                             # Makes tracks 01 02 not 1 2
EXTRAVERBOSE=2                          # Useful for debugging
#COMMENT='abcde version 2.7.2'           # Place a comment...
EJECTCD=y                               # Please eject cd when finished :-)
WAVOUTPUTDIR='/tmp'

mungefilename ()
{
  # echo "$@" | sed s,:,-,g | tr / _ | tr -d \'\"\?\[:cntrl:\]
  # echo "$@" | sed s,:,\ -,g | tr /\* _+ | tr -d \'\"\?\[:cntrl:\]
  echo "$@" | sed -e 's/^\.*//' -e "s/[ \"':]/_/g" | tr -d ":><|*/\"'?[:cntrl:]"
}
